name: CI

on:
  pull_request:
  push:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FLUTTER_REVISION: 924134a44c189315be2148659913dda1671cbe99
  DENO_VERSION: 2.9.3

jobs:
  flutter:
    name: Flutter tests and analyze
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned Flutter
        shell: bash
        run: |
          git clone --filter=blob:none --no-checkout https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          git -C "$RUNNER_TEMP/flutter" checkout --detach "$FLUTTER_REVISION"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
      - name: Install locked Dart dependencies
        run: scripts/ci/technical-health.sh flutter-dependencies
      - name: Verify committed generated sources
        run: scripts/ci/technical-health.sh flutter-generated
      - name: Check formatting
        run: scripts/ci/technical-health.sh flutter-format
      - name: Analyze
        run: scripts/ci/technical-health.sh flutter-analyze
      - name: Test with inert public config
        run: scripts/ci/technical-health.sh flutter-test
      - name: Check task engine package
        run: scripts/ci/technical-health.sh task-engine
      - name: Verify public task engine consumer contract
        run: scripts/ci/technical-health.sh task-engine-consumer-contract

  backend-static:
    name: Migrations and Supabase functions
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: ${{ env.DENO_VERSION }}
      - name: Check migrations and pinned imports
        run: scripts/ci/technical-health.sh backend-migrations
      - name: Format, lint, and typecheck functions
        run: scripts/ci/technical-health.sh backend-check
      - name: Test functions
        run: scripts/ci/technical-health.sh backend-test

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Run value-suppressed full-history gate
        run: scripts/ci/technical-health.sh secret-scan

  workflow-regression:
    name: Workflow regression checks
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify workflow safeguards
        run: scripts/ci/technical-health.sh workflows

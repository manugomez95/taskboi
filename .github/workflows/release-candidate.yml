name: Release candidate

on:
  workflow_dispatch:

concurrency:
  group: release-candidate
  cancel-in-progress: false

permissions:
  contents: read

env:
  FLUTTER_REVISION: 924134a44c189315be2148659913dda1671cbe99

jobs:
  package:
    name: Build attestable release candidate
    if: github.ref == 'refs/heads/main'
    environment: release
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install pinned Flutter
        shell: bash
        run: |
          git clone --filter=blob:none --no-checkout https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          git -C "$RUNNER_TEMP/flutter" checkout --detach "$FLUTTER_REVISION"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
      - name: Scan full Git history
        shell: bash
        run: scripts/ci/secret-scan.sh history
      - name: Build locked artifacts
        shell: bash
        run: |
          config_file="$(mktemp "$RUNNER_TEMP/taskboi-public-config.XXXXXX.json")"
          trap 'rm -f "$config_file"' EXIT
          printf '%s\n' '{"PUBLIC_SUPABASE_URL":"https://example.invalid","PUBLIC_SUPABASE_ANON_KEY":"inert-release-value"}' > "$config_file"
          flutter pub get --enforce-lockfile
          flutter build web --release --dart-define-from-file="$config_file"
          mkdir -p release
          tar --sort=name --mtime='UTC 1970-01-01' --owner=0 --group=0 --numeric-owner \
            -czf release/taskboi-web.tar.gz -C build/web .
      - uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          path: .
          format: spdx-json
          output-file: release/taskboi.spdx.json
          upload-artifact: false
      - name: Generate committed-input compliance inventory
        shell: bash
        run: |
          scripts/generate-compliance-inventory.py --revision "$GITHUB_SHA" --output-dir release
          scripts/validate-spdx.py release/oss-compliance-sbom.spdx.json
          scripts/validate-spdx.py release/taskboi.spdx.json
      - name: Verify actual candidate contents against inventory scope
        shell: bash
        run: |
          scripts/verify-release-candidate.py \
            --inventory release/oss-compliance-inventory.json \
            --web-archive release/taskboi-web.tar.gz \
            --output release/release-candidate-inventory-comparison.json
      - name: Generate and verify candidate checksums
        working-directory: release
        shell: bash
        run: |
          find . -maxdepth 1 -type f ! -name SHA256SUMS -printf '%f\n' \
            | LC_ALL=C sort \
            | xargs sha256sum > SHA256SUMS
          sha256sum --check --strict SHA256SUMS
      - name: Scan release artifacts
        shell: bash
        run: scripts/ci/secret-scan.sh artifacts release
      - uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: release/*
      - uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-path: release/taskboi-web.tar.gz
          sbom-path: release/taskboi.spdx.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: taskboi-release-candidate-${{ github.sha }}
          path: release/
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

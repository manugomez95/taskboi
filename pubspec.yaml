name: taskboi
description: "A Todoist-inspired task management app with cross-platform support."
publish_to: 'none'
version: 1.15.4+97

environment:
  sdk: ^3.6.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # UI
  cupertino_icons: ^1.0.8
  flutter_adaptive_scaffold: ^0.3.2

  # Supabase
  supabase_flutter: ^2.8.3

  # State Management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # Routing
  go_router: ^14.6.2

  # Data Classes
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0

  # Utilities
  uuid: ^4.5.1
  intl: ^0.20.2
  google_sign_in: ^6.2.2
  crypto: ^3.0.6
  url_launcher: ^6.2.5
  app_links: ^6.3.3

  # Encryption
  flutter_secure_storage: ^9.0.0
  pointycastle: ^3.7.3
  bip39: ^1.0.6

  # Local Storage
  shared_preferences: ^2.2.2

  # Offline Support
  drift: ^2.14.0
  drift_flutter: ^0.2.0
  path_provider: ^2.1.2
  path: ^1.8.3
  connectivity_plus: ^5.0.2

  # File handling
  file_picker: ^8.0.0
  share_plus: ^10.0.0
  image_picker: ^1.1.2

  # App Info
  package_info_plus: ^8.0.0

  # Home Screen Widget
  home_widget: ^0.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  http: ^1.6.0
  mocktail: ^1.0.4

  # Code Generation
  build_runner: ^2.4.14
  freezed: ^2.5.7
  json_serializable: ^6.9.0
  riverpod_generator: ^2.6.3
  drift_dev: ^2.14.0

  # App Icons
  flutter_launcher_icons: ^0.14.2

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/icons/

flutter_launcher_icons:
  android: true
  ios: true
  macos:
    generate: true
    image_path: "assets/icons/app_icon.jpg"
  web:
    generate: true
    image_path: "assets/icons/app_icon.jpg"
  image_path: "assets/icons/app_icon.jpg"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/icons/app_icon.jpg"

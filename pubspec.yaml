name: taskboi
description: "A Todoist-inspired task management app with cross-platform support."
publish_to: 'none'
version: 1.15.4+97

environment:
  sdk: ^3.6.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # UI
  cupertino_icons: ^1.0.9
  flutter_adaptive_scaffold: ^0.3.2

  # Supabase
  supabase_flutter: ^2.8.3

  # State Management
  flutter_riverpod: ^3.3.2
  riverpod_annotation: ^4.0.3

  # Routing
  go_router: ^17.3.0

  # Data Classes
  freezed_annotation: ^3.1.0
  json_annotation: ^4.12.0

  # Utilities
  uuid: ^4.6.0
  intl: ^0.20.2
  google_sign_in: ^7.2.0
  crypto: ^3.0.6
  url_launcher: ^6.2.5
  app_links: ^7.2.1

  # Encryption
  flutter_secure_storage: ^10.3.1
  pointycastle: ^3.7.3
  bip39: ^1.0.6

  # Local Storage
  shared_preferences: ^2.5.5

  # Offline Support
  drift: ^2.34.2
  drift_flutter: ^0.3.1
  path_provider: ^2.1.6
  path: ^1.8.3
  connectivity_plus: ^7.3.0

  # File handling
  file_picker: ^11.0.2
  share_plus: ^12.0.2
  image_picker: ^1.2.3

  # App Info
  package_info_plus: ^9.0.1

  # Home Screen Widget
  home_widget: ^0.9.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  http: ^1.6.0
  mocktail: ^1.0.5

  # Code Generation
  build_runner: ^2.15.1
  freezed: ^3.2.6-dev.1
  json_serializable: ^6.14.0
  riverpod_generator: ^4.0.4
  drift_dev: ^2.34.0

  # App Icons
  flutter_launcher_icons: ^0.14.2

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/icons/

flutter_launcher_icons:
  android: true
  ios: true
  macos:
    generate: true
    image_path: "assets/icons/app_icon.jpg"
  web:
    generate: true
    image_path: "assets/icons/app_icon.jpg"
  image_path: "assets/icons/app_icon.jpg"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/icons/app_icon.jpg"

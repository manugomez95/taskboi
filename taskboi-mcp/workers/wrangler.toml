name = "taskboi-mcp-template"
main = "src/index.ts"
compatibility_date = "2025-01-20"
compatibility_flags = ["nodejs_compat"]

# Required deployment bindings are intentionally not given placeholder values.
# Configure required OAUTH_ISSUER as the canonical HTTPS origin and
# OAUTH_ENCRYPTION_KEY as a Worker secret before deployment. OAUTH_CLIENTS is an
# optional compatibility allowlist for clients with a prior relationship.
# OAUTH_CLIENT_METADATA_ALLOWED_ORIGINS is an optional plaintext JSON array of
# exact HTTPS publisher origins; absent means URL client IDs are rejected.
# This is a public canonical origin, not a credential.
[vars]
OAUTH_ISSUER = "https://YOUR_OAUTH_ISSUER.example.invalid"

[[durable_objects.bindings]]
name = "OAUTH_STORE"
class_name = "OAuthStore"

[[migrations]]
tag = "v3"
new_sqlite_classes = ["OAuthStore"]

[observability]
enabled = true
